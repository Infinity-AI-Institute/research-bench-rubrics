<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResearchBench — Task-Graph Explorer</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="container">
    <header class="site">
      <h1>ResearchBench — Task-Graph Explorer</h1>
      <p class="sub">Every paper in the benchmark with its reproduction task graph as an explorable dependency tree. Pick a split (ResearchBench 10/20/50/100) and click a paper to open its graph.</p>
    </header>

    <div class="legend" id="legend"></div>

    <div class="searchbar">
      <select id="view" aria-label="Benchmark view"></select>
      <input id="search" type="search" placeholder="Filter papers by title or slug…" aria-label="Filter papers" />
    </div>

    <div id="collections"><p class="empty">Loading…</p></div>
  </div>

  <script src="assets/common.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
